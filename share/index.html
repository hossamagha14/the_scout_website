<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Scout - Shared Video</title>
    <meta name="description" content="Watch a shared video from The Scout." />
    <style>
      :root {
        --bg: #0f1115;
        --card: #171a20;
        --text: #f4f6f8;
        --muted: #a2a8b3;
        --accent: #00d56f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, #1a1f28 0%, var(--bg) 45%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .wrap {
        width: min(980px, 100%);
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(22px, 2.8vw, 34px);
        line-height: 1.15;
      }
      p {
        margin: 0 0 14px;
        color: var(--muted);
      }
      .card {
        border: 1px solid #2a2f3a;
        border-radius: 18px;
        background: linear-gradient(180deg, #1a1f27, var(--card));
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      video {
        width: 100%;
        height: min(76vh, 820px);
        background: #000;
        display: block;
      }
      .status {
        padding: 18px 16px 4px;
        color: var(--muted);
        font-size: 15px;
      }
      .status.error { color: #ff7272; }
      .meta {
        padding: 0 16px 18px;
        font-size: 13px;
        color: #8f95a1;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Shared video</h1>
      <div class="card">
        <p id="status" class="status">Loading video...</p>
        <video id="player" controls playsinline preload="metadata"></video>
        <p id="meta" class="meta"></p>
      </div>
      <p style="margin-top: 14px;">
        Open The Scout app for the full feed and profile context.
      </p>
    </main>
    <script>
      const PUBLIC_SHARE_API = "https://getpublicvideoshare-zw2nks6u2q-uc.a.run.app";

      function extractShareId() {
        const url = new URL(window.location.href);
        const q = (url.searchParams.get("shareId") || "").trim();
        if (q) return q;

        // Backward-compatible support for old hash links like `#/s/<id>`.
        const hash = (url.hash || "").replace(/^#/, "");
        const m = hash.match(/^\/?s\/([^/?#]+)/i);
        return m ? decodeURIComponent(m[1]) : "";
      }

      async function boot() {
        const status = document.getElementById("status");
        const meta = document.getElementById("meta");
        const player = document.getElementById("player");
        const shareId = extractShareId();

        if (!shareId) {
          status.textContent = "Missing share id.";
          status.classList.add("error");
          meta.innerHTML = "Try opening a full link from the app share action.";
          return;
        }

        try {
          const res = await fetch(`${PUBLIC_SHARE_API}?shareId=${encodeURIComponent(shareId)}`);
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          const payload = await res.json();
          const downloadUrl = String(payload.downloadUrl || "").trim();
          if (!downloadUrl) {
            throw new Error("Video unavailable");
          }

          player.src = downloadUrl;
          status.textContent = "Tap play to watch.";
          meta.textContent = `Share ID: ${shareId}`;
        } catch (err) {
          status.textContent = "This shared video is unavailable.";
          status.classList.add("error");
          meta.innerHTML = `Share ID: ${shareId} · Error: ${String(err)}`;
        }
      }

      boot();
    </script>
  </body>
</html>
